name: Console Bug Report
description: Something in Warthog doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.
        Please submit one bug per issue. Warthog never provides game files or proprietary SDK files,
        so please do not attach maps, disc images, or SDK binaries.
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform / Environment
      options:
        - "Original Xbox: development kit"
        - "Original Xbox: modified retail console"
        - "Original Xbox: xemu"
        - "Other console (scaffolding, docs/consoles.md)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / Version
      description: The git commit SHA or build version you tested.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Subsystem Area
      options:
        - Crash / Assertion Failure
        - Online Games List
        - System Link / Cross-Play
        - Controller / Gamepad Input
        - Graphics / Shaders
        - Audio / DirectSound / AX
        - Memory Pools / Texture Cache
        - Menus & HUD
        - Campaign / SP Levels
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Description and Reproduction Steps
      description: What happened, step-by-step instructions to reproduce, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: Attach relevant log output (debug.txt, XBDM logs, xenia.log, Cemu log.txt, or terminal output).
